name: Isolated APK download production build
on:
  push:
    branches: [wip/apk-neutral-ci-20261115]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 32f61b5cbe0332249789ee7fc038eac9add1904f
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: node --experimental-strip-types --test tests/apk-download-http.test.mjs tests/apk-download.test.mjs tests/kontraprompter-apk-publish.test.mjs
      - run: npm run build
        env:
          SESSION_SECRET: isolated-build-only-secret-0123456789
          ADMIN_PASSWORD: isolated-build-only-password
          DATA_DIR: /tmp/videomaker-isolated-build-data
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Test production server with synthetic login and APK
        env:
          SESSION_SECRET: isolated-test-only-secret-012345678901234
          ADMIN_PASSWORD: isolated-test-only-password
          VIDEOMAKER_PUBLIC_ORIGIN: http://127.0.0.1:39171
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -eu
          fixture=$(mktemp -d)
          export DATA_DIR="$fixture"
          printf 'PK\003\004synthetic-apk' > "$fixture/kontraprompter.apk"
          node node_modules/next/dist/bin/next start -H 127.0.0.1 -p 39171 > "$fixture/server.log" 2>&1 &
          pid=$!
          cleanup() { kill "$pid" 2>/dev/null || :; wait "$pid" 2>/dev/null || :; rm -rf "$fixture"; }
          trap cleanup EXIT
          for i in $(seq 1 100); do
            if curl -s -o /dev/null "$VIDEOMAKER_PUBLIC_ORIGIN/api/apk"; then break; fi
            kill -0 "$pid" || { cat "$fixture/server.log"; exit 1; }
            sleep .2
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' "$VIDEOMAKER_PUBLIC_ORIGIN/api/apk")" = 401
          curl -fsS -c "$fixture/cookies" -H "Origin: $VIDEOMAKER_PUBLIC_ORIGIN" -H 'Content-Type: application/json' --data '{"password":"isolated-test-only-password"}' "$VIDEOMAKER_PUBLIC_ORIGIN/api/login" > /dev/null
          curl -fsSI -b "$fixture/cookies" "$VIDEOMAKER_PUBLIC_ORIGIN/api/apk" > "$fixture/headers"
          grep -Fi 'content-disposition: attachment; filename="KontraPrompter.apk"' "$fixture/headers"
          grep -Fi 'cache-control: private, no-store' "$fixture/headers"
          curl -fsS -b "$fixture/cookies" "$VIDEOMAKER_PUBLIC_ORIGIN/api/apk" > "$fixture/download.apk"
          cmp "$fixture/kontraprompter.apk" "$fixture/download.apk"
          curl -fsS -b "$fixture/cookies" "$VIDEOMAKER_PUBLIC_ORIGIN/" > "$fixture/page.html"
          grep -Fq 'KontraPrompter für Android herunterladen' "$fixture/page.html"
      - name: Record build identity and file hashes
        run: |
          set -eu
          rm -rf .next/cache
          git diff --exit-code
          git rev-parse HEAD > BUILD-SOURCE-COMMIT.txt
          node --version > BUILD-NODE-VERSION.txt
          sha256sum package-lock.json > BUILD-LOCK-SHA256.txt
          cat .next/BUILD_ID > BUILD-ID.txt
          find .next -type f -print0 | sort -z | xargs -0 sha256sum > BUILD-FILES-SHA256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apk-neutral-next-32f61b5
          path: |
            .next/
            BUILD-*.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
