name: Isolated Videomaker production build
on:
  push:
    branches: [wip/ci-session-tone-3d22c9-20261115]
permissions:
  contents: read
jobs:
  production-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: '--max-old-space-size=4096'
      DATA_DIR: /tmp/videomaker-build-synthetic-data
    steps:
      - name: Check out isolated CI commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact application source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '3d22c9096b5bc4090ef2a8f4fffbca5f7caeeadd'
          test "$(git rev-parse HEAD^{tree})" != "$(git rev-parse HEAD^^{tree})"
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/videomaker-ci-production-build.yml'
          test "$(git rev-parse HEAD^^{tree})" = '6212df80b538b778525b6bf911771807a08e630a'
      - name: Install exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
          check-latest: false
      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund
      - name: Check session and draft tests explicitly
        run: NODE_NO_WARNINGS=1 node --experimental-strip-types --test tests/session-fetch.test.mjs tests/session-draft-render.test.mjs
      - name: Check Grok tone and multipart tests explicitly
        run: NODE_NO_WARNINGS=1 node --experimental-strip-types --test tests/grok-pipeline.test.mjs tests/independent-multipart.test.mjs tests/script-options.test.mjs
      - name: Run unit and available integration tests
        run: npm test
      - name: Check TypeScript
        run: npx tsc --noEmit --incremental false --pretty false
      - name: Build exact application source
        run: npm run build
      - name: Package build and record runtime requirements
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v22.23.2'
          test -s .next/BUILD_ID
          mkdir -p "$RUNNER_TEMP/videomaker-artifact"
          find .next -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/videomaker-artifact/next-files.sha256"
          find node_modules -name '*.node' -type f -print | LC_ALL=C sort > "$RUNNER_TEMP/videomaker-artifact/native-modules.txt"
          tar -C "$GITHUB_WORKSPACE" -czf "$RUNNER_TEMP/videomaker-artifact/videomaker-next-session-tone.tar.gz" .next
          git archive --format=tar 3d22c9096b5bc4090ef2a8f4fffbca5f7caeeadd | gzip -n > "$RUNNER_TEMP/videomaker-artifact/videomaker-source.tar.gz"
          cd "$RUNNER_TEMP/videomaker-artifact"
          sha256sum videomaker-next-session-tone.tar.gz videomaker-source.tar.gz next-files.sha256 native-modules.txt > SHA256SUMS
          node - "$GITHUB_WORKSPACE" "$GITHUB_SHA" <<'NODE'
          const fs=require('node:fs');const cp=require('node:child_process');const crypto=require('node:crypto');
          const root=process.argv[2],ciCommit=process.argv[3];
          const hash=path=>crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex');
          const manifest={schema:1,applicationCommit:'3d22c9096b5bc4090ef2a8f4fffbca5f7caeeadd',applicationTree:'6212df80b538b778525b6bf911771807a08e630a',ciCommit,buildCommand:'npm ci --no-audit --no-fund && node --experimental-strip-types --test tests/session-fetch.test.mjs tests/session-draft-render.test.mjs && npm test && npx tsc --noEmit --incremental false --pretty false && npm run build',node:process.version,nodeModulesAbi:process.versions.modules,napi:process.versions.napi,platform:process.platform,arch:process.arch,glibc:cp.execFileSync('getconf',['GNU_LIBC_VERSION'],{encoding:'utf8'}).trim(),npm:cp.execFileSync('npm',['--version'],{encoding:'utf8'}).trim(),next:require(root+'/node_modules/next/package.json').version,lockfileSha256:hash(root+'/package-lock.json'),archiveSha256:hash('videomaker-next-session-tone.tar.gz'),sourceArchiveSha256:hash('videomaker-source.tar.gz'),nativeDependenciesIncluded:false,runtimeNote:'Separate archives contain exact Git source and .next. Install matching lockfile dependencies and verify native modules/runtime before use; build is not deployed.'};
          fs.writeFileSync('manifest.json',JSON.stringify(manifest,null,2)+'\n');
          NODE
          sha256sum manifest.json >> SHA256SUMS
          cat manifest.json
          cat SHA256SUMS
      - name: Upload isolated build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: videomaker-next-session-tone-${{ github.sha }}
          path: ${{ runner.temp }}/videomaker-artifact/
          if-no-files-found: error
          retention-days: 3
