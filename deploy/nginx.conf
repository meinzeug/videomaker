# Optional alternative for a dedicated Nginx host with existing TLS certificates.
# On the shared dorfspy host the deployment uses its existing Caddy instead.
server {
    listen 443 ssl;
    server_name videomaker.dorfspy.de;
    ssl_certificate /etc/letsencrypt/live/videomaker.dorfspy.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/videomaker.dorfspy.de/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:3270;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
    }
}
